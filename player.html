<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Odio el chocolate</title>
  <style>
    :root{color-scheme:dark;--lime:#d8ff36;--pink:#ff4f9a}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{min-height:100vh;display:grid;place-items:center;padding:14px;
      background:radial-gradient(circle at 50% 15%,#4c174b,#100b1d 65%);
      color:#fff;font-family:Arial,Helvetica,sans-serif}
    main{width:min(720px,100%);padding:clamp(10px,2.5vw,20px);
      border:1px solid #ff4f9a88;border-radius:22px;background:#130e20;
      box-shadow:0 0 36px #ff4f9a22;text-align:center}
    h1{margin:0 0 12px;color:var(--lime);font-size:clamp(21px,4vw,36px)}
    video{display:block;width:100%;max-height:72vh;object-fit:contain;background:#050505;border-radius:12px}
    /* No native controls: playback and movement run automatically where browser policy permits. */
    #enableAudio{display:none;margin:14px auto 0;border:0;border-radius:999px;
      padding:13px 22px;font-weight:900;background:var(--lime);color:#171323;cursor:pointer}
    #status{min-height:1.5em;margin:10px 0 0;color:#e9dced;font-size:12px;line-height:1.45}
    body.bump main{filter:brightness(1.16)}
  </style>
</head>
<body>
  <main>
    <h1>ODIO EL CHOCOLATE</h1>
    <video id="video" autoplay playsinline preload="auto" disablepictureinpicture>
      <source src="media/odio-el-trojano.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>
    <button id="enableAudio" type="button">▶ ACTIVAR AUDIO Y MOVIMIENTO</button>
    <p id="status" role="status" aria-live="polite">Cargando el video…</p>
  </main>
  <script>
    (() => {
      const video = document.getElementById("video");
      const enableAudio = document.getElementById("enableAudio");
      const status = document.getElementById("status");

      let audioContext = null;
      let analyser = null;
      let sourceNode = null;
      let frequencyData = null;
      let frameRequest = 0;
      let moving = false;
      let averageBass = 0;
      let previousBass = 0;
      let lastBeatAt = 0;
      let lastJumpAt = 0;
      let returnTimer = 0;
      let homeX = window.screenX;
      let homeY = window.screenY;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function setupAudio() {
        if (audioContext) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("Web Audio no está disponible");
        audioContext = new AudioContextClass();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.7;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        sourceNode = audioContext.createMediaElementSource(video);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
      }

      function jumpWindow(now) {
        // A brief, restrained bounce. The browser/OS may choose to ignore moveTo().
        if (now - lastJumpAt < 260) return;
        lastJumpAt = now;
        const left = Number.isFinite(screen.availLeft) ? screen.availLeft : 0;
        const top = Number.isFinite(screen.availTop) ? screen.availTop : 0;
        const maxLeft = left + screen.availWidth - window.outerWidth;
        const maxTop = top + screen.availHeight - window.outerHeight;
        const safeX = clamp(homeX, left, Math.max(left, maxLeft));
        const safeY = clamp(homeY - 22, top, Math.max(top, maxTop));

        try {
          window.moveTo(safeX, safeY);
          document.body.classList.add("bump");
          clearTimeout(returnTimer);
          returnTimer = setTimeout(() => {
            try { window.moveTo(homeX, homeY); } catch (_) {}
            document.body.classList.remove("bump");
          }, 115);
        } catch (_) {
          status.textContent = "El navegador está reproduciendo el video; este sistema no permite mover la ventana.";
        }
      }

      function analyseFrame(now) {
        if (!moving || !analyser || video.paused || video.ended) return;
        analyser.getByteFrequencyData(frequencyData);

        // Average the lowest frequency bins (bass), then detect a fresh peak.
        let bass = 0;
        const firstBin = 2;
        const lastBin = Math.min(22, frequencyData.length);
        for (let i = firstBin; i < lastBin; i++) bass += frequencyData[i];
        bass /= Math.max(1, lastBin - firstBin);

        averageBass = averageBass === 0 ? bass : averageBass * 0.93 + bass * 0.07;
        const threshold = Math.max(20, averageBass * 1.28);
        const peak = bass > threshold && bass > previousBass * 1.035;

        if (peak && now - lastBeatAt > 240) {
          lastBeatAt = now;
          jumpWindow(now);
        }

        previousBass = bass;
        frameRequest = requestAnimationFrame(analyseFrame);
      }

      async function begin() {
        try {
          setupAudio();
          await audioContext.resume();
          await video.play();

          homeX = window.screenX;
          homeY = window.screenY;
          averageBass = 0;
          previousBass = 0;
          lastBeatAt = 0;
          lastJumpAt = 0;
          moving = true;
          enableAudio.style.display = "none";
          status.textContent = "▶ Reproduciendo. La ventana salta cuando detecta los golpes de graves.";
          cancelAnimationFrame(frameRequest);
          frameRequest = requestAnimationFrame(analyseFrame);
        } catch (error) {
          moving = false;
          enableAudio.style.display = "block";
          status.textContent = "Chrome bloqueó el autoplay con sonido. Pulsa el único botón para activar audio y movimiento.";
        }
      }

      // Try audible autoplay on popup load. If browser policy blocks it, show a one-click fallback.
      window.addEventListener("load", () => {
        begin();
      });

      enableAudio.addEventListener("click", () => {
        begin();
      });

      video.addEventListener("playing", () => {
        if (moving) status.textContent = "▶ Reproduciendo y detectando el ritmo…";
      });

      video.addEventListener("ended", () => {
        moving = false;
        cancelAnimationFrame(frameRequest);
        clearTimeout(returnTimer);
        try { window.moveTo(homeX, homeY); } catch (_) {}
        document.body.classList.remove("bump");
        status.textContent = "El video terminó.";
      });

      video.addEventListener("error", () => {
        moving = false;
        enableAudio.style.display = "none";
        status.textContent = "No se encontró media/odio-el-trojano.mp4. Añade un video que tengas permiso de publicar.";
      });

      // Esc stops the motion without trapping the user or blocking Chrome's normal close button.
      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && moving) {
          moving = false;
          cancelAnimationFrame(frameRequest);
          clearTimeout(returnTimer);
          try { window.moveTo(homeX, homeY); } catch (_) {}
          document.body.classList.remove("bump");
          status.textContent = "Movimiento detenido con Esc. Puedes cerrar esta ventana con la X de Chrome.";
        }
      });

      window.addEventListener("beforeunload", () => {
        moving = false;
        cancelAnimationFrame(frameRequest);
        clearTimeout(returnTimer);
        try { if (audioContext) audioContext.close(); } catch (_) {}
      });
    })();
  </script>
</body>
</html>

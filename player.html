<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODIO EL TROYANO</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308}
    body{font-family:Arial,Helvetica,sans-serif;color:#fff}
    #video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#050308;display:block;will-change:transform,filter;transition:transform 240ms cubic-bezier(.2,.75,.25,1),filter 420ms ease}
    #phaseAmbience{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,#777 0%,#333 58%,#08080b 100%);transition:opacity 1200ms ease}
    body.phase-two #phaseAmbience{opacity:.2;animation:ambientPulse 7s ease-in-out infinite alternate}
    body.phase-three #phaseAmbience{opacity:.27;animation:ambientPulse 2.8s ease-in-out infinite alternate}
    @keyframes ambientPulse{from{opacity:.10}to{opacity:.25}}
    #startScreen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#53164c 0,#1a0b26 55%,#050308 100%)}
    .panel{width:min(520px,100%);padding:clamp(24px,6vw,48px);border:2px solid #ff4f9a99;border-radius:26px;background:#110d1df2;box-shadow:0 0 55px #ff4f9a44}
    h1{font-size:clamp(32px,8vw,64px);line-height:.93;margin:0 0 16px;color:#d8ff36;text-shadow:4px 4px 0 #d62981;letter-spacing:-2px}
    p{color:#eadced;line-height:1.5;font-size:14px}
    #startButton{border:0;border-radius:999px;padding:16px 30px;font-size:18px;font-weight:900;background:#d8ff36;color:#171323;cursor:pointer;box-shadow:0 5px 0 #809b13}
    #startButton:active{transform:translateY(3px);box-shadow:0 2px 0 #809b13}
    #startButton:disabled{opacity:.7;cursor:wait}
    #error{display:none;color:#ffd36b;font-size:13px;margin-top:14px;overflow-wrap:anywhere}

    #finalScreen{position:fixed;inset:0;z-index:20;display:none;background:#000}
    #finalScreen.show{display:block}
    #finalImage{display:block;width:100vw;height:100vh;object-fit:fill}
    #finalMessage{position:absolute;inset:0;display:none;place-items:center;background:#000;color:#fff;font:24px Arial,Helvetica,sans-serif}
    #finalScreen.message #finalImage{display:none}
    #finalScreen.message #finalMessage{display:grid}
    body.started{cursor:none}
    body.started #video{cursor:none}
  </style>
</head>
<body>
  <video id="video" playsinline preload="auto" disablepictureinpicture>
    <source src="media/odio-el-trojano.mp4" type="video/mp4">
  </video>
  <div id="phaseAmbience" aria-hidden="true"></div>
  <div id="finalScreen" aria-live="polite"><img id="finalImage" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22720%22%20height%3D%22400%22%20viewBox%3D%220%200%20720%20400%22%3E%3Crect%20width%3D%22720%22%20height%3D%22400%22%20fill%3D%22%230000aa%22%2F%3E%3Crect%20x%3D%22270%22%20y%3D%22144%22%20width%3D%22171%22%20height%3D%2217%22%20fill%3D%22%23aaaaaa%22%2F%3E%3Ctext%20x%3D%22355.5%22%20y%3D%22156%22%20fill%3D%22%230000aa%22%20text-anchor%3D%22middle%22%20font-family%3D%22monospace%22%20font-size%3D%2214%22%20font-weight%3D%22bold%22%20letter-spacing%3D%221%22%3EOdio%20El%20Chocolate%3C%2Ftext%3E%3Cg%20fill%3D%22%23fff%22%20font-family%3D%22monospace%22%20font-size%3D%2214%22%20font-weight%3D%22bold%22%20letter-spacing%3D%221%22%3E%3Ctext%20x%3D%2244%22%20y%3D%22188%22%3EA%20fatal%20exception%200E%20has%20occurred%20at%200028%3AC002ADB7%20in%20VXD%20VFAT(01)%20%2B%3C%2Ftext%3E%3Ctext%20x%3D%2244%22%20y%3D%22204%22%3E00000A3D7.%20The%20current%20application%20will%20be%20terminated.%3C%2Ftext%3E%3Ctext%20x%3D%2244%22%20y%3D%22236%22%3E*%20%20Press%20any%20key%20to%20terminate%20the%20current%20application.%3C%2Ftext%3E%3Ctext%20x%3D%2244%22%20y%3D%22252%22%3E*%20%20Press%20CTRL%2BALT%2BDEL%20again%20to%20restart%20your%20computer.%20You%20will%3C%2Ftext%3E%3Ctext%20x%3D%2272%22%20y%3D%22268%22%3Elose%20any%20unsaved%20information%20in%20all%20applications.%3C%2Ftext%3E%3Ctext%20x%3D%22360%22%20y%3D%22300%22%20text-anchor%3D%22middle%22%3EODIAMOS%20CHOCOLATE%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E"><div id="finalMessage">jaja, te asustaste</div></div>

  <section id="startScreen">
    <div class="panel">
      <h1>ODIO EL<br>TROYANO</h1>
      <p>Ready? The video will fill this window and the window will try to bounce with the beat.</p>
      <button id="startButton" type="button">▶ START THE VIDEO</button>
      <p id="error" role="status" aria-live="polite"></p>
    </div>
  </section>

  <script>
    (() => {
      const video = document.getElementById("video");
      const startScreen = document.getElementById("startScreen");
      const startButton = document.getElementById("startButton");
      const error = document.getElementById("error");
      const finalScreen = document.getElementById("finalScreen");
      const videoUrl = new URL("media/odio-el-trojano.mp4", document.baseURI).href;

      let audioContext = null;
      let analyser = null;
      let sourceNode = null;
      let masterGain = null;
      let frequencyData = null;
      let frameRequest = 0;
      let moving = false;
      let averageBass = 0;
      let previousBass = 0;
      let lastBeatAt = 0;
      let lastJumpAt = 0;
      let returnTimer = 0;
      let movementFrame = 0;
      let phaseTwo = false;
      let phaseThree = false;
      let phaseFour = false;
      let phaseThreeLoops = 0;
      let lastVideoTime = 0;
      let finalTimer = 0;
      let chaosTimer = 0;
      let homeX = window.screenX;
      let homeY = window.screenY;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function showError(message) {
        error.textContent = message;
        error.style.display = "block";
        startButton.disabled = false;
        startButton.textContent = "▶ TRY AGAIN";
      }

      function mediaErrorMessage() {
        if (!video.error) return "No se pudo cargar el video. Revisa que el MP4 exista en media/odio-el-trojano.mp4.";
        const messages = {
          1: "La carga del video fue interrumpida.",
          2: "Error de red al descargar el MP4.",
          3: "El navegador no pudo decodificar el video.",
          4: "No se encontró un MP4 compatible en media/odio-el-trojano.mp4."
        };
        return messages[video.error.code] || "No se pudo cargar el MP4. Revisa media/odio-el-trojano.mp4.";
      }

      function waitForVideo() {
        if (video.error) return Promise.reject(new Error(mediaErrorMessage()));
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("El video tardó demasiado en cargar. Comprueba el archivo MP4 y vuelve a intentarlo."));
          }, 15000);

          function cleanup() {
            clearTimeout(timeout);
            video.removeEventListener("canplay", onReady);
            video.removeEventListener("error", onError);
          }
          function onReady() { cleanup(); resolve(); }
          function onError() { cleanup(); reject(new Error(mediaErrorMessage())); }

          video.addEventListener("canplay", onReady);
          video.addEventListener("error", onError);
          video.load();
        });
      }

      function setupAudio() {
        if (audioContext) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("Web Audio no está disponible en este navegador.");
        audioContext = new AudioContextClass();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.25;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        sourceNode = audioContext.createMediaElementSource(video);
        masterGain = audioContext.createGain();
        masterGain.gain.value = 1;
        sourceNode.connect(analyser);
        analyser.connect(masterGain);
        masterGain.connect(audioContext.destination);
      }

      function animateWindowTo(targetX, targetY, duration, curveAmount = 0) {
        if (movementFrame) cancelAnimationFrame(movementFrame);

        const startX = Number.isFinite(window.screenX) ? window.screenX : homeX;
        const startY = Number.isFinite(window.screenY) ? window.screenY : homeY;
        const startedAt = performance.now();
        const left = Number.isFinite(screen.availLeft) ? screen.availLeft : 0;
        const top = Number.isFinite(screen.availTop) ? screen.availTop : 0;
        const maxLeft = left + screen.availWidth - window.outerWidth;
        const maxTop = top + screen.availHeight - window.outerHeight;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const distance = Math.hypot(dx, dy) || 1;
        const normalX = -dy / distance;
        const normalY = dx / distance;

        function frame(now) {
          const t = Math.min(1, (now - startedAt) / duration);
          // Smooth acceleration and deceleration, with a curved arc between positions.
          const eased = t * t * (3 - 2 * t);
          const arc = Math.sin(Math.PI * t) * curveAmount;
          const x = clamp(startX + dx * eased + normalX * arc, left, Math.max(left, maxLeft));
          const y = clamp(startY + dy * eased + normalY * arc, top, Math.max(top, maxTop));

          try {
            window.moveTo(Math.round(x), Math.round(y));
          } catch (_) {
            // Chrome or the operating system may block popup movement.
          }

          if (t < 1) {
            movementFrame = requestAnimationFrame(frame);
          } else {
            movementFrame = 0;
          }
        }

        movementFrame = requestAnimationFrame(frame);
      }

      function jumpWindow(now, force = false) {
        // Beat-triggered random destinations create a lively but continuous drift.
        const minimumBeatGap = phaseThree ? 80 : (phaseTwo ? 112 : 145);
        if (!force && now - lastJumpAt < minimumBeatGap) return;
        lastJumpAt = now;

        const left = Number.isFinite(screen.availLeft) ? screen.availLeft : 0;
        const top = Number.isFinite(screen.availTop) ? screen.availTop : 0;
        const maxLeft = left + screen.availWidth - window.outerWidth;
        const maxTop = top + screen.availHeight - window.outerHeight;

        // Phase 3 can choose any safe point on the available screen area.
        const burst = Math.random() < (phaseThree ? 0.52 : (phaseTwo ? 0.38 : 0.22));
        let safeX;
        let safeY;

        if (phaseThree) {
          const margin = 12;
          const minX = left + margin;
          const minY = top + margin;
          const maxX = Math.max(minX, maxLeft - margin);
          const maxY = Math.max(minY, maxTop - margin);
          safeX = minX + Math.random() * Math.max(0, maxX - minX);
          safeY = minY + Math.random() * Math.max(0, maxY - minY);
        } else {
          const rangeX = phaseTwo ? (burst ? 330 : 245) : (burst ? 225 : 165);
          const rangeY = phaseTwo ? (burst ? 230 : 170) : (burst ? 155 : 115);
          safeX = clamp(homeX + (Math.random() * 2 - 1) * rangeX, left, Math.max(left, maxLeft));
          safeY = clamp(homeY + (Math.random() * 2 - 1) * rangeY, top, Math.max(top, maxTop));
        }

        const duration = phaseThree ? 60 + Math.random() * 45
          : (phaseTwo ? 145 + Math.random() * 115 : 175 + Math.random() * 115);
        const curve = (Math.random() * 2 - 1) * (phaseThree ? (burst ? 150 : 110)
          : (phaseTwo ? (burst ? 95 : 72) : (burst ? 62 : 42)));

        clearTimeout(returnTimer);
        animateWindowTo(safeX, safeY, duration, curve);

        if (phaseTwo) {
          const tilt = (Math.random() * 2 - 1) * (phaseThree ? (burst ? 18 : 13) : (burst ? 11 : 8));
          const scale = phaseThree ? 1.07 + Math.random() * (burst ? 0.18 : 0.12)
            : 1.045 + Math.random() * (burst ? 0.13 : 0.085);
          const shiftX = (Math.random() * 2 - 1) * (phaseThree ? (burst ? 34 : 24) : (burst ? 22 : 14));
          const shiftY = (Math.random() * 2 - 1) * (phaseThree ? (burst ? 28 : 19) : (burst ? 18 : 12));
          video.style.transform = `translate3d(${shiftX}px,${shiftY}px,0) rotate(${tilt}deg) scale(${scale})`;
          video.style.filter = `saturate(${1.15 + Math.random() * (phaseThree ? 1.6 : 1.2)}) contrast(${1.03 + Math.random() * (phaseThree ? .34 : .24)})`;
        }

        // If the beat stops, glide back to the starting position instead of staying offset.
        returnTimer = setTimeout(() => returnWindowHome(), 520);
      }

      function returnWindowHome() {
        clearTimeout(returnTimer);
        const duration = 260 + Math.random() * 100;
        const curve = (Math.random() * 2 - 1) * 24;
        animateWindowTo(homeX, homeY, duration, curve);
      }
      function analyseFrame(now) {
        if (!moving || !analyser || video.paused || video.ended) return;
        analyser.getByteFrequencyData(frequencyData);

        let bass = 0;
        const firstBin = 3;
        const lastBin = Math.min(18, frequencyData.length);
        for (let i = firstBin; i < lastBin; i++) bass += frequencyData[i];
        bass /= Math.max(1, lastBin - firstBin);

        averageBass = averageBass === 0 ? bass : averageBass * 0.95 + bass * 0.05;
        const threshold = Math.max(9, averageBass * 1.12);
        const peak = bass > threshold && bass > previousBass * 1.025;

        if (peak && now - lastBeatAt > 210) {
          lastBeatAt = now;
          jumpWindow(now);
        }

        previousBass = bass;
        frameRequest = requestAnimationFrame(analyseFrame);
      }

      async function startVideo() {
        // Request real browser fullscreen directly from the START click.
        // Browsers reject fullscreen requests made later from a timer.
        if (document.fullscreenElement !== document.documentElement && document.documentElement.requestFullscreen) {
          try {
            await document.documentElement.requestFullscreen();
          } catch (fullscreenError) {
            console.warn("Fullscreen was not granted; continuing in the current window.", fullscreenError);
          }
        }
        startButton.disabled = true;
        startButton.textContent = "LOADING VIDEO...";
        error.style.display = "none";

        try {
          // Always point at the exact expected file; do not rely on currentSrc
          // being populated before the browser has selected the media resource.
          if (!video.currentSrc) video.src = videoUrl;
          await waitForVideo();

          // Audio analysis is optional: playback should still start if Web Audio
          // is unavailable, instead of making the button appear to do nothing.
          try {
            setupAudio();
            await audioContext.resume();
          } catch (audioError) {
            analyser = null;
            console.warn("Beat detection unavailable:", audioError);
          }

          homeX = window.screenX;
          homeY = window.screenY;
          await video.play();

          startScreen.remove();
          document.body.classList.add("started");

          moving = true;
          if (analyser) {
            averageBass = 0;
            previousBass = 0;
            lastBeatAt = 0;
            lastJumpAt = 0;
            jumpWindow(performance.now(), true);
            cancelAnimationFrame(frameRequest);
            frameRequest = requestAnimationFrame(analyseFrame);
          }
        } catch (err) {
          showError(err && err.message ? err.message : mediaErrorMessage());
        }
      }

      video.addEventListener("error", () => {
        if (startScreen.isConnected) showError(mediaErrorMessage());
      });

      startButton.addEventListener("click", startVideo);

      function enterPhaseThree() {
        if (phaseThree) return;
        phaseThree = true;
        phaseThreeLoops = 0;
        lastVideoTime = 0;
        document.title = "ODIO EL TROYANO - FASE 3";
        document.body.classList.add("phase-three");
        video.style.transition = "transform 90ms cubic-bezier(.15,.8,.2,1), filter 180ms ease";
        video.playbackRate = 1.25;
        if (masterGain && audioContext) {
          masterGain.gain.setTargetAtTime(1.35, audioContext.currentTime, 0.2);
        }
        lastBeatAt = 0;
        lastJumpAt = 0;
        chaosTimer = setTimeout(phaseThreePulse, 80);
      }

      function enterPhaseFour() {
        if (phaseFour) return;
        phaseFour = true;
        moving = false;
        cancelAnimationFrame(frameRequest);
        cancelAnimationFrame(movementFrame);
        clearTimeout(returnTimer);
        clearTimeout(chaosTimer);
        document.title = "ODIO EL TROYANO - FINAL";
        video.pause();
        video.playbackRate = 1;
        if (masterGain && audioContext) masterGain.gain.setTargetAtTime(1, audioContext.currentTime, 0.12);
        video.style.transition = "none";
        video.style.transform = "none";
        video.style.filter = "none";
        document.body.classList.remove("phase-two","phase-three");
        finalScreen.classList.add("show");
        finalTimer = setTimeout(() => finalScreen.classList.add("message"), 2600);
      }

      video.addEventListener("timeupdate", () => {
        if (!phaseThree || phaseFour || !video.loop) return;
        const now = video.currentTime;
        if (lastVideoTime > 1 && now + 0.75 < lastVideoTime) {
          phaseThreeLoops++;
          if (phaseThreeLoops >= 2) enterPhaseFour();
        }
        lastVideoTime = now;
      });

      function phaseThreePulse() {
        if (!moving || !phaseThree || video.paused) return;
        jumpWindow(performance.now(), true);
        // Keep movement lively between musical peaks too; the X key remains untouched.
        chaosTimer = setTimeout(phaseThreePulse, 80 + Math.random() * 60);
      }

      video.addEventListener("ended", async () => {
        // The first full playback ends Phase 1 and starts Phase 2.
        if (!phaseTwo) {
          phaseTwo = true;
          document.title = "ODIO EL TROYANO - FASE 2";
          document.body.classList.add("phase-two");
          video.loop = false;
          video.currentTime = 0;
          averageBass = 0;
          previousBass = 0;
          lastBeatAt = 0;
          lastJumpAt = 0;

          try {
            await video.play();
            moving = true;
            if (analyser) {
              cancelAnimationFrame(frameRequest);
              frameRequest = requestAnimationFrame(analyseFrame);
            }
            jumpWindow(performance.now(), true);
          } catch (err) {
            moving = false;
            console.warn("No se pudo iniciar la fase dos:", err);
          }
          return;
        }

        // The second full playback ends Phase 2 and starts Phase 3 immediately.
        if (phaseTwo && !phaseThree) {
          enterPhaseThree();
          video.loop = true;
          video.currentTime = 0;
          try {
            await video.play();
            moving = true;
            if (analyser) {
              cancelAnimationFrame(frameRequest);
              frameRequest = requestAnimationFrame(analyseFrame);
            }
          } catch (err) {
            moving = false;
            console.warn("No se pudo iniciar la fase tres:", err);
          }
        }
      });

      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && moving) {
          moving = false;
          cancelAnimationFrame(frameRequest);
          clearTimeout(chaosTimer);
          clearTimeout(finalTimer);
          if (phaseFour) {
            finalScreen.classList.add("show","message");
            return;
          }
          video.playbackRate = 1;
          if (masterGain && audioContext) {
            masterGain.gain.setTargetAtTime(1, audioContext.currentTime, 0.15);
          }
          returnWindowHome();
        }
      });

      window.addEventListener("beforeunload", () => {
        moving = false;
        cancelAnimationFrame(frameRequest);
        cancelAnimationFrame(movementFrame);
        clearTimeout(returnTimer);
        clearTimeout(chaosTimer);
        clearTimeout(finalTimer);
        try { if (audioContext) audioContext.close(); } catch (_) {}
      });
    })();
  </script>
</body>
</html>

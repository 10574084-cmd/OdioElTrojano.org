<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODIO EL TROYANO</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308}
    body{font-family:Arial,Helvetica,sans-serif;color:#fff}
    #video{
      position:fixed;inset:0;width:100vw;height:100vh;
      object-fit:contain;background:#050308;display:block;
    }
    #startScreen{
      position:fixed;inset:0;z-index:5;display:grid;place-items:center;
      padding:24px;text-align:center;
      background:radial-gradient(circle at 50% 35%,#53164c 0,#1a0b26 55%,#050308 100%);
    }
    .panel{width:min(520px,100%);padding:clamp(24px,6vw,48px);
      border:2px solid #ff4f9a99;border-radius:26px;background:#110d1df2;
      box-shadow:0 0 55px #ff4f9a44}
    h1{font-size:clamp(32px,8vw,64px);line-height:.93;margin:0 0 16px;
      color:#d8ff36;text-shadow:4px 4px 0 #d62981;letter-spacing:-2px}
    p{color:#eadced;line-height:1.5;font-size:14px}
    #startButton{border:0;border-radius:999px;padding:16px 30px;
      font-size:18px;font-weight:900;background:#d8ff36;color:#171323;
      cursor:pointer;box-shadow:0 5px 0 #809b13}
    #startButton:active{transform:translateY(3px);box-shadow:0 2px 0 #809b13}
    #error{display:none;color:#ffd36b;font-size:13px;margin-top:14px}
    body.started{cursor:none}
    body.started #video{cursor:none}
  </style>
</head>
<body>
  <video id="video" autoplay playsinline preload="auto" disablepictureinpicture>
    <source src="media/odio-el-trojano.mp4" type="video/mp4">
  </video>

  <section id="startScreen">
    <div class="panel">
      <h1>ODIO EL<br>TROYANO</h1>
      <p>Ready? The video will fill this window and the window will try to bounce with the beat.</p>
      <button id="startButton" type="button">▶ START THE VIDEO</button>
      <p id="error" role="status" aria-live="polite"></p>
    </div>
  </section>

  <script>
    (() => {
      const video = document.getElementById("video");
      const startScreen = document.getElementById("startScreen");
      const startButton = document.getElementById("startButton");
      const error = document.getElementById("error");

      let audioContext = null;
      let analyser = null;
      let sourceNode = null;
      let frequencyData = null;
      let frameRequest = 0;
      let moving = false;
      let averageBass = 0;
      let previousBass = 0;
      let lastBeatAt = 0;
      let lastJumpAt = 0;
      let returnTimer = 0;
      let homeX = window.screenX;
      let homeY = window.screenY;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function setupAudio() {
        if (audioContext) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("Web Audio is not available.");
        audioContext = new AudioContextClass();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.7;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        sourceNode = audioContext.createMediaElementSource(video);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
      }

      function jumpWindow(now) {
        if (now - lastJumpAt < 260) return;
        lastJumpAt = now;

        const left = Number.isFinite(screen.availLeft) ? screen.availLeft : 0;
        const top = Number.isFinite(screen.availTop) ? screen.availTop : 0;
        const maxLeft = left + screen.availWidth - window.outerWidth;
        const maxTop = top + screen.availHeight - window.outerHeight;
        const safeX = clamp(homeX, left, Math.max(left, maxLeft));
        const safeY = clamp(homeY - 24, top, Math.max(top, maxTop));

        try {
          window.moveTo(safeX, safeY);
          clearTimeout(returnTimer);
          returnTimer = setTimeout(() => {
            try { window.moveTo(homeX, homeY); } catch (_) {}
          }, 120);
        } catch (_) {
          // Browser/OS policy may block physical popup movement.
        }
      }

      function analyseFrame(now) {
        if (!moving || !analyser || video.paused || video.ended) return;
        analyser.getByteFrequencyData(frequencyData);

        let bass = 0;
        const firstBin = 2;
        const lastBin = Math.min(22, frequencyData.length);
        for (let i = firstBin; i < lastBin; i++) bass += frequencyData[i];
        bass /= Math.max(1, lastBin - firstBin);

        averageBass = averageBass === 0 ? bass : averageBass * 0.93 + bass * 0.07;
        const threshold = Math.max(20, averageBass * 1.28);
        const peak = bass > threshold && bass > previousBass * 1.035;

        if (peak && now - lastBeatAt > 240) {
          lastBeatAt = now;
          jumpWindow(now);
        }

        previousBass = bass;
        frameRequest = requestAnimationFrame(analyseFrame);
      }

      async function startVideo() {
        startButton.disabled = true;
        error.style.display = "none";
        try {
          if (!video.querySelector("source") || !video.currentSrc) {
            throw new Error("The MP4 is missing. Add media/odio-el-trojano.mp4 to the repository.");
          }

          setupAudio();
          await audioContext.resume();

          // This is a popup created from the previous page's click. Capture its position
          // before playback; movement is best-effort because browser/OS policy can deny it.
          homeX = window.screenX;
          homeY = window.screenY;

          await video.play();

          moving = true;
          averageBass = 0;
          previousBass = 0;
          lastBeatAt = 0;
          lastJumpAt = 0;

          startScreen.remove();
          document.body.classList.add("started");
          cancelAnimationFrame(frameRequest);
          frameRequest = requestAnimationFrame(analyseFrame);
        } catch (err) {
          startButton.disabled = false;
          error.textContent = err && err.message ? err.message : "Could not start the video.";
          error.style.display = "block";
        }
      }

      startButton.addEventListener("click", startVideo);

      video.addEventListener("ended", () => {
        moving = false;
        cancelAnimationFrame(frameRequest);
        clearTimeout(returnTimer);
        try { window.moveTo(homeX, homeY); } catch (_) {}
      });

      video.addEventListener("error", () => {
        startButton.disabled = false;
        error.textContent = "Video not found. Add a video you are allowed to publish at media/odio-el-trojano.mp4.";
        error.style.display = "block";
      });

      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && moving) {
          moving = false;
          cancelAnimationFrame(frameRequest);
          clearTimeout(returnTimer);
          try { window.moveTo(homeX, homeY); } catch (_) {}
        }
      });

      window.addEventListener("beforeunload", () => {
        moving = false;
        cancelAnimationFrame(frameRequest);
        clearTimeout(returnTimer);
        try { if (audioContext) audioContext.close(); } catch (_) {}
      });
    })();
  </script>
</body>
</html>
